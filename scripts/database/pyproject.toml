[project]
name = "rts-db-caller"
version = "0.1.0"
description = "从 .env 读取 DATABASE_URL，连接 PostgreSQL 并执行运行时传入的 SQL 脚本文件"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
