# RTS web-ui 容器内 nginx 配置
#
# 由 docker/entrypoint.sh 把 __API_UPSTREAM__ 占位符替换成实际上游地址后
# 渲染到 /etc/nginx/nginx.conf。之所以走占位符替换而不是 nginx 自带的
# envsubst 模板，是为了避免误替换 nginx 自身的 $uri / $host 等变量。

worker_processes auto;

# 日志直接打到容器标准输出/错误流，便于 docker logs 查看
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;
    keepalive_timeout 65;

    # 非 root 运行：临时目录全部落在 /tmp（/tmp 可写）
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml text/javascript
                      application/json application/javascript application/xml
                      application/xml+rss image/svg+xml;

    server {
        # 容器内监听 8080（非 root 无法绑定 80）
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # 健康检查
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # 构建产物带内容 hash，可长期缓存
        location /assets/ {
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # 入口页不缓存，保证发版后能拿到新的资源清单
        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        # 反向代理到 rts-center。
        # proxy_pass 不带 URI 部分 → nginx 原样透传完整原始 URI（/api/v1/...）
        location /api/ {
            proxy_pass __API_UPSTREAM__;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # SPA history fallback：前端路由直接刷新也要返回 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
